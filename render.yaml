# Render Infrastructure-as-Code Blueprint for DJ Mart
services:
  - type: web
    name: djmart-ecommerce
    env: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: 10000
      - key: JAVA_OPTS
        value: "-Xmx512m -Xms256m"
