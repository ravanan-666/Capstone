<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect width="600" height="600" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="560" height="560" rx="16" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Center Decorative Circle -->
  <circle cx="300" cy="260" r="90" fill="#ffffff" filter="drop-shadow(0px 8px 16px rgba(15, 23, 42, 0.06))"/>
  
  <!-- Shopping Bag / Box Icon -->
  <g transform="translate(255, 215)">
    <!-- Bag Body -->
    <path d="M12 28 C12 22 16 18 22 18 L68 18 C74 18 78 22 78 28 L84 74 C85 80 80 86 74 86 L16 86 C10 86 5 80 6 74 Z" 
          fill="url(#iconGrad)"/>
    <!-- Bag Handle -->
    <path d="M30 20 L30 14 C30 6 60 6 60 14 L60 20" 
          fill="none" stroke="#1d4ed8" stroke-width="5" stroke-linecap="round"/>
    <!-- Inner Accent Star/Sparkle -->
    <path d="M45 42 L47 50 L55 52 L47 54 L45 62 L43 54 L35 52 L43 50 Z" 
          fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Brand Typography -->
  <text x="300" y="400" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1e293b" letter-spacing="1.5">
    DJ MART
  </text>
  <text x="300" y="430" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#64748b" letter-spacing="0.5">
    Product Preview Available
  </text>
</svg>
